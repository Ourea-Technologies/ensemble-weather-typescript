name: Bug report
description: Something in the TypeScript/JavaScript SDK does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a security problem, do not open an issue: see SECURITY.md. Never paste an API key.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: A minimal program that shows it
      render: ts
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SDK version (`VERSION`) and runtime (Node.js, Deno, Bun, browser, Workers) with its version
    validations:
      required: true
  - type: input
    id: request-id
    attributes:
      label: The X-Request-Id of a failing call (`error.requestId` or `result.meta.requestId`), if any

name: Feature request
description: Suggest an improvement to the SDK.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: Anything that needs new numbers (a probability, a total) is a request for a server-side query, since the SDK never computes statistics itself.
